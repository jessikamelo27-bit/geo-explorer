name: Testes

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  testar:
    name: Rodar testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Rodar testes
        run: npm test
