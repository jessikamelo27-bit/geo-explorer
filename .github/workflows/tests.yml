name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verificar:
    name: Verificar projeto
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verificar estrutura do projeto
        run: |
          echo "✅ Projeto carregado com sucesso"
          echo "📁 Arquivos presentes:"
          ls src/commands/
          ls src/data/
          ls tests/
